<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LeapVE 4 Point Calibration</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #050505;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =====================================================
           MAIN SCREEN
        ===================================================== */

        #app {

            width: 100vw;
            height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;

        }


        /* =====================================================
           CALIBRATION PANEL

           IMPORTANT:
           Video and Three.js have EXACTLY
           the same dimensions.
        ===================================================== */

        #calibration-panel {

            position: relative;

            width: min(1280px, 96vw);

            aspect-ratio: 16 / 9;

            max-height: 90vh;

            overflow: hidden;

            background: #000;

            border:
                2px solid
                rgba(0, 255, 255, 0.35);

            box-shadow:
                0 0 20px
                rgba(0, 255, 255, 0.08);

        }


        /* =====================================================
           CAMERA

           Camera occupies the EXACT panel.
        ===================================================== */

        #camera {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            display: block;

            object-fit: fill;

            background: #000;

            z-index: 1;

        }


        /* =====================================================
           THREE.JS OVERLAY

           EXACT SAME SIZE AS CAMERA
        ===================================================== */

        #three-container {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            pointer-events: auto;

        }


        #three-container canvas {

            display: block;

            width: 100%;
            height: 100%;

        }


        /* =====================================================
           UI
        ===================================================== */

        #status {

            position: absolute;

            top: 20px;
            left: 20px;

            z-index: 10;

            padding: 14px 18px;

            min-width: 250px;

            color: white;

            background:
                rgba(0, 0, 0, 0.72);

            border:
                1px solid
                rgba(0, 255, 255, 0.45);

            border-radius: 10px;

            backdrop-filter:
                blur(8px);

            pointer-events: none;

        }


        .title {

            font-size: 22px;

            font-weight: 800;

            letter-spacing: 3px;

            color: #00ffff;

            margin-bottom: 8px;

            text-shadow:
                0 0 10px #00ffff;

        }


        #point-status {

            font-size: 14px;

            font-weight: bold;

            color: #00ff66;

            margin-bottom: 8px;

        }


        #coordinates {

            font-size: 11px;

            color: #ffffff;

            opacity: 0.75;

            line-height: 1.5;

        }


        .instructions {

            margin-top: 8px;

            font-size: 11px;

            line-height: 1.5;

            color: #ccc;

        }


        /* =====================================================
           CONTROLS
        ===================================================== */

        #controls {

            position: absolute;

            bottom: 20px;
            left: 20px;

            z-index: 20;

            display: flex;

            gap: 10px;

        }


        button {

            border: none;

            padding: 10px 16px;

            border-radius: 7px;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;

            color: #000;

            background: #00ff66;

            box-shadow:
                0 0 12px
                rgba(0, 255, 102, 0.35);

        }


        button:hover {

            transform: scale(1.03);

        }


        #reset-btn {

            background: #00ffff;

        }


        /* =====================================================
           CAMERA STATUS
        ===================================================== */

        #camera-status {

            position: absolute;

            top: 20px;
            right: 20px;

            z-index: 20;

            padding: 8px 12px;

            font-size: 11px;

            color: #ffff00;

            background:
                rgba(0, 0, 0, 0.65);

            border-radius: 6px;

            pointer-events: none;

        }


    </style>

</head>


<body>


<div id="app">


    <!-- =====================================================
         CALIBRATION PANEL
    ===================================================== -->

    <div id="calibration-panel">


        <!-- CAMERA -->

        <video
            id="camera"
            autoplay
            playsinline
            muted
        ></video>


        <!-- THREE.JS -->

        <div id="three-container"></div>


        <!-- CAMERA STATUS -->

        <div id="camera-status">
            CAMERA: INITIALIZING...
        </div>


        <!-- UI -->

        <div id="status">

            <div class="title">
                LEAPVE
            </div>

            <div id="point-status">
                PRESS START
            </div>

            <div id="coordinates">
                No points
            </div>

            <div class="instructions">

                Click:
                P1 → P2 → P3 → P4

                <br>

                Drag points to edit

                <br>

                R = Reset

            </div>

        </div>


        <!-- CONTROLS -->

        <div id="controls">

            <button id="start-btn">
                START CALIBRATION
            </button>

            <button id="reset-btn">
                RESET
            </button>

        </div>


    </div>

</div>


<!-- =========================================================
     THREE.JS
========================================================= -->

<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"

    }
}

</script>


<script
    type="module"
    src="main.js"
></script>


</body>

</html>
