<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LeapVE 4 Point Calibration</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         CAMERA
         ===================================================== -->

    <video
        id="camera"
        autoplay
        playsinline
        muted
    ></video>


    <!-- =====================================================
         THREE.JS OVERLAY
         ===================================================== -->

    <div id="three-container"></div>


    <!-- =====================================================
         UI
         ===================================================== -->

    <div id="status">

        <div class="title">
            LEAPVE
        </div>

        <div id="point-status">
            SELECT P1
        </div>

        <div class="instructions">

            Click:
            P1 → P2 → P3 → P4

            <br>

            Drag points to edit

            <br>

            R = Reset

        </div>

    </div>


    <!-- =====================================================
         THREE.JS
         ===================================================== -->

    <script type="importmap">

    {
        "imports": {

            "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"

        }
    }

    </script>


    <script
        type="module"
        src="main.js"
    ></script>


</body>

</html>
