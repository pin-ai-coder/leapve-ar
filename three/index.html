<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LeapVE AR — 4 Point Calibration</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        /* =====================================================
           CAMERA
           ===================================================== */

        #camera {
            position: fixed;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 0;

            background: black;
        }


        /* =====================================================
           THREE.JS
           ===================================================== */

        #three-container {
            position: fixed;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            z-index: 10;

            pointer-events: none;
        }

        #three-container canvas {
            display: block;

            width: 100%;
            height: 100%;
        }


        /* =====================================================
           UI
           ===================================================== */

        #ui {
            position: fixed;

            top: 20px;
            left: 20px;

            z-index: 100;

            font-family: Arial, sans-serif;

            color: white;

            background: rgba(0, 0, 0, 0.75);

            padding: 16px;

            border-radius: 12px;

            border: 1px solid rgba(0, 255, 255, 0.4);

            backdrop-filter: blur(8px);

            min-width: 240px;
        }


        #title {
            font-size: 18px;

            font-weight: bold;

            margin-bottom: 12px;

            color: #00ffff;

            text-shadow:
                0 0 5px #00ffff,
                0 0 15px #00ffff;
        }


        button {
            width: 100%;

            margin-top: 8px;

            padding: 10px;

            border: 1px solid #00ffff;

            border-radius: 8px;

            background: rgba(0, 255, 255, 0.1);

            color: #00ffff;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {
            background: rgba(0, 255, 255, 0.25);

            box-shadow:
                0 0 10px rgba(0, 255, 255, 0.5);
        }


        #resetButton {
            border-color: #ff3366;

            color: #ff6688;
        }


        #status {
            margin-top: 12px;

            font-family: monospace;

            font-size: 13px;

            line-height: 1.5;

            color: white;
        }


        #instructions {
            margin-top: 8px;

            font-size: 12px;

            color: #aaa;
        }

    </style>
</head>

<body>

    <!-- =====================================================
         CAMERA
         ===================================================== -->

    <img
        id="camera"
        src="http://localhost:5000/video"
    >


    <!-- =====================================================
         THREE.JS OVERLAY
         ===================================================== -->

    <div id="three-container"></div>


    <!-- =====================================================
         UI
         ===================================================== -->

    <div id="ui">

        <div id="title">
            LEAPVE AR
        </div>

        <button id="initializeButton">
            INITIALIZE 4 POINTS
        </button>

        <button id="resetButton">
            RESET POINTS
        </button>

        <div id="status">
            Waiting...
        </div>

        <div id="instructions">
            Initialize first.<br>
            Then click 4 corners.<br>
            Drag points to edit them.
        </div>

    </div>


    <!-- =====================================================
         THREE.JS
         ===================================================== -->

    <script type="importmap">
    {
        "imports": {
            "three":
                "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

            "three/addons/":
                "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>


    <script
        type="module"
        src="main.js"
    ></script>

</body>
</html>
